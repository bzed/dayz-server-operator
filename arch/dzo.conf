#
# dzo's pacman repository, published next to the documentation, the apt and the
# dnf repository. Include it from /etc/pacman.conf:
#
#   curl -fsSLo /etc/pacman.d/dzo.conf https://bzed.github.io/dayz-server-operator/arch/dzo.conf
#   printf '\nInclude = /etc/pacman.d/dzo.conf\n' >>/etc/pacman.conf
#
# or append these lines to /etc/pacman.conf by hand.
#
# Both the repository database (repo-add --sign, dzo.db.sig) and every package
# (a detached <package>.pkg.tar.zst.sig) are signed with the same key that signs
# the apt and dnf repositories; import it first, or pacman rejects the database:
#
#   curl -fsSLo /tmp/dzo-repo-keyring.asc https://bzed.github.io/dayz-server-operator/arch/dzo-repo-keyring.asc
#   pacman-key --add /tmp/dzo-repo-keyring.asc
#   pacman-key --lsign-key 184CDDC496A9C739D10F67B0FE4EE03444314050
#
# SigLevel: packages and the database must be signed by the locally signed key
# (the default SigLevel, "Required DatabaseOptional", does not require the
# database signature).
[dzo]
Server = https://bzed.github.io/dayz-server-operator/arch
SigLevel = Required DatabaseRequired
