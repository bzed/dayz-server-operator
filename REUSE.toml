version = 1
SPDX-PackageName = "dayz-server-operator"
SPDX-PackageSupplier = "Bernd Zeimetz <bernd@bzed.de>"
SPDX-PackageDownloadLocation = "https://github.com/bzed/dayz-server-operator"

# .gitmodules is git configuration; go.sum is a machine-generated, strictly-formatted checksum lockfile: it
# cannot carry a comment header without breaking `go mod verify`.
[[annotations]]
path = ["go.sum", ".gitmodules"]
SPDX-FileCopyrightText = "2026 Bernd Zeimetz <bernd@bzed.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Debian source control metadata in formats that don't conventionally (or
# cannot, per their own file format) carry an SPDX comment header.
[[annotations]]
path = ["debian/control", "debian/changelog", "debian/copyright", "debian/source/format", "debian/*.install", "debian/*.manpages"]
SPDX-FileCopyrightText = "2026 Bernd Zeimetz <bernd@bzed.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Test fixtures and golden files: byte-exact inputs/outputs that cannot carry
# a comment header without changing what they test.
[[annotations]]
path = "**/testdata/**"
SPDX-FileCopyrightText = "2026 Bernd Zeimetz <bernd@bzed.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Self-hosted web fonts, subset to Latin and converted to WOFF2 (Barlow
# Condensed from https://github.com/jpt/barlow, Source Sans 3 from Debian's
# fonts-adobe-sourcesans3). Binary files cannot carry a header.
[[annotations]]
path = "internal/web/static/fonts/BarlowCondensed-*.woff2"
SPDX-FileCopyrightText = "2017 The Barlow Project Authors (https://github.com/jpt/barlow)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "internal/web/static/fonts/SourceSans3-*.woff2"
SPDX-FileCopyrightText = "2010-2021, 2023 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"

# The cheat sheet PDF is built from docs/cheatsheet/template.html; it embeds subsets of IBM Plex.
[[annotations]]
path = "docs/cheatsheet/dzo-cheatsheet.pdf"
SPDX-FileCopyrightText = ["2026 Bernd Zeimetz <bernd@bzed.de>", "2017 IBM Corp. (IBM Plex, https://github.com/IBM/plex)"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND OFL-1.1"

# PBO prefix files hold a bare prefix string and cannot carry a header.
[[annotations]]
path = "testmods/**/$PBOPREFIX$"
SPDX-FileCopyrightText = "2026 Bernd Zeimetz <bernd@bzed.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The apt repository: reprepro configuration and the public signing key.
[[annotations]]
path = ["apt/conf/distributions", "apt/dzo-archive-keyring.asc"]
SPDX-FileCopyrightText = "2026 Bernd Zeimetz <bernd@bzed.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
