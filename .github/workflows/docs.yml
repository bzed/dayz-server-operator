# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Build the Sphinx documentation (warnings are errors) and the signed apt, dnf
# and pacman repositories, and publish them on GitHub Pages from main (the docs
# at /, the repositories at /apt/, /rpm/ and /arch/). Pull requests only build
# the docs. The site is built when CI has passed on main (workflow_run); the
# repositories hold the packages that CI run built, which are not built a second
# time here. Needs Settings > Pages > Source: "GitHub Actions" once, and the
# secret APT_GPG_PRIVATE_KEY (see docs/installation.rst), which signs all three
# repositories. Only the commit that is the head of main when the deploy job runs
# updates the site. Third-party actions are pinned by commit SHA.

name: Docs

on:
  # After CI has passed on main: the apt, dnf and pacman repositories publish the packages CI built.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

# Only pull requests cancel each other. A workflow_run is never cancelled: its ref is refs/heads/main
# also for a run from a fork, so a fork's run must not cancel or replace the publish of main.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    # The workflow_run branch needs the trust test of the apt job (see there).
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # In a trixie container like the apt job: apt on the hosted Ubuntu runner hangs
    container:
      image: debian:trixie
    steps:
      - name: Install git and make
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make
      # No ref: a workflow_run checks out the head of main, a pull_request its merge commit. Never
      # the head_sha of the triggering run, which can come from a fork branch named main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Sphinx
        run: apt-get install -y --no-install-recommends python3-sphinx
      - name: Build
        run: make docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_run'
        with:
          name: docs-html
          path: docs/_build/html

  # The jobs below sign with APT_GPG_PRIVATE_KEY and take the CI run's packages. They run only for a
  # push to main of this repository, so a pull request from a fork whose branch is named main (its
  # CI run has head_branch main) never reaches the key. The check is repeated in each job, before
  # the key is imported, because a job runs on its own and the deploy job is too late.
  apt:
    name: Build apt repository
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the package from the CI run
    # Same container as the deb job in ci.yml: the package is built for trixie.
    container:
      image: debian:trixie
    steps:
      - name: Install git (actions/checkout needs it)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      # No ref: the head of main (see the build job). The deploy job checks it is the CI run's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only the commit that is the head of main right now may be signed. A run that main has moved
      # past (or a re-run of an old one) stops here, before the key is imported. The deploy job
      # makes the same check. git ls-remote, not gh: the containers have no gh.
      - name: Is this run's commit the head of main?
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "::error title=Not the head of main::$SHA is not the head of main ($head); nothing is signed" >&2
            exit 1
          fi
      - name: Install repository tools
        run: apt-get install -y --no-install-recommends reprepro gnupg
      # The package the CI run built (a snapshot version) is published as it is, not built again.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzo-deb
          path: ci-deb
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build and sign the repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "secret APT_GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          mkdir debs
          mv ci-deb/dzo_*.deb debs/
          scripts/build-apt-repo.sh debs apt-repo
          # the key the repository is signed with must be the published one
          gpg --armor --export | diff - apt/dzo-archive-keyring.asc
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt-repo
          path: apt-repo

  rpm-repo:
    name: Build dnf repository
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the package from the CI run
    # The same Fedora container the rpm job builds in, so the tools match.
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install git (actions/checkout needs it) and the repository tools
        run: dnf install -y git ca-certificates rpm-sign createrepo_c gnupg2 diffutils
      # No ref: the head of main (see the build job). The deploy job checks it is the CI run's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is this run's commit the head of main?
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "::error title=Not the head of main::$SHA is not the head of main ($head); nothing is signed" >&2
            exit 1
          fi
      # The package the CI run built (a snapshot version) is published as it is, not built again.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzo-rpm
          path: ci-rpm
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build and sign the repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "secret APT_GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          mkdir rpms
          mv ci-rpm/dzo-*.rpm rpms/
          scripts/build-rpm-repo.sh rpms rpm-repo
          # the key the repository is signed with must be the published one
          gpg --armor --export | diff - rpm/dzo-repo-keyring.asc
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-repo
          path: rpm-repo

  arch-repo:
    name: Build pacman repository
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the package from the CI run
    # The same rolling container the arch job builds in, so repo-add and gpg match.
    container:
      image: docker.io/library/archlinux:latest
    steps:
      - name: Upgrade the image and install git and the repository tools
        # The image is a snapshot of the archive; a partial upgrade fails on file
        # conflicts. repo-add comes with pacman, gpg with gnupg.
        run: pacman -Syu --noconfirm --needed git ca-certificates gnupg diffutils
      # No ref: the head of main (see the build job). The deploy job checks it is the CI run's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is this run's commit the head of main?
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "::error title=Not the head of main::$SHA is not the head of main ($head); nothing is signed" >&2
            exit 1
          fi
      # The package the CI run built (a snapshot version) is published as it is, not built again.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzo-arch-pkg
          path: ci-arch
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build and sign the repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "secret APT_GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          mkdir pkgs
          mv ci-arch/dzo-*.pkg.tar.zst pkgs/
          scripts/build-arch-repo.sh pkgs arch-repo
          # the key the repository is signed with must be the published one
          gpg --armor --export | diff - arch/dzo-repo-keyring.asc
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-repo
          path: arch-repo

  publish:
    name: Assemble the site
    needs: [build, apt, rpm-repo, arch-repo]
    # Arch is best effort: a failed arch or arch-repo job must not hold back the docs, the apt
    # and the dnf repository. The others must have succeeded; always() lets the job run when
    # only arch-repo failed (a pull request skips build's dependents, so it skips this too).
    if: >-
      always() && needs.build.result == 'success' && needs.apt.result == 'success' &&
      needs.rpm-repo.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-html
          path: site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt-repo
          path: site/apt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rpm-repo
          path: site/rpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.arch-repo.result == 'success'
        with:
          name: arch-repo
          path: site/arch
      # Pages replaces the whole site: without a new pacman repository, keep the one that is
      # published, so Arch hosts keep their last snapshot instead of a 404. Every file is taken
      # as it is served; the signatures were made when it was built.
      - name: Keep the published pacman repository
        if: needs.arch-repo.result != 'success'
        env:
          BASE: https://bzed.github.io/dayz-server-operator/arch
        run: |
          set -eu
          mkdir -p site/arch
          cd site/arch
          if ! curl -fsSLO "$BASE/dzo.db"; then
            echo "::warning title=No pacman repository::the arch-repo job failed and none is published yet; the site has no /arch/"
            exit 0
          fi
          for f in dzo.db.sig dzo.conf dzo-repo-keyring.asc; do curl -fsSLO "$BASE/$f"; done
          for pkg in $(tar -xOzf dzo.db --wildcards '*/desc' | awk 'f{print; f=0} /^%FILENAME%$/{f=1}'); do
            curl -fsSLO "$BASE/$pkg"
            curl -fsSLO "$BASE/$pkg.sig"
          done
          echo "::warning title=pacman repository not updated::the arch-repo job failed; the published repository is kept as it was"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Only the commit that is the head of main right now may update the site: a re-run of an older
      # run, or a run that main has moved past while it was building, must not put old pages over new.
      # Asked here, at the last moment, not at the start of the workflow.
      - id: head
        name: Is this the head of main?
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "current=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=Pages not updated::$SHA is not the head of main ($head), so it does not publish"
          fi
      - id: deployment
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The published repositories as a user meets them: fetched over HTTPS from Pages, with the
  # signatures enforced (apt's Signed-By, dnf's gpgcheck and repo_gpgcheck, pacman's SigLevel),
  # and the package installed with the distribution's dependencies. The CI install jobs only
  # test the package file of their own run; this catches a broken signature, repository file
  # or URL. It runs after a deploy that published and says when the installed build is not the
  # one this run published. Arch is best effort here too.
  verify-repos:
    name: Install from the published repository (${{ matrix.image }})
    needs: deploy
    if: needs.deploy.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            experimental: false
          - image: registry.fedoraproject.org/fedora:44
            experimental: false
          - image: docker.io/library/archlinux:latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    container:
      image: ${{ matrix.image }}
    env:
      BASE: https://bzed.github.io/dayz-server-operator
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Install dzo from the repository
        run: |
          set -eu
          . /etc/os-release
          case "$ID" in
          debian)
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl
            # steamcmd is non-free and i386 only, as in the package-install job
            sed -i /etc/apt/sources.list.d/debian.sources -e 's/^Components: main$/Components: main contrib non-free/'
            dpkg --add-architecture i386
            echo steamcmd steam/question select "I AGREE" | debconf-set-selections
            echo steamcmd steam/license note '' | debconf-set-selections
            install -d /etc/apt/keyrings
            curl -fsSLo /etc/apt/keyrings/dzo-archive-keyring.asc "$BASE/apt/dzo-archive-keyring.asc"
            printf '%s\n' 'Types: deb' "URIs: $BASE/apt" 'Suites: stable' 'Components: main' \
              'Architectures: amd64' 'Signed-By: /etc/apt/keyrings/dzo-archive-keyring.asc' \
              >/etc/apt/sources.list.d/dzo.sources
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dzo
            ;;
          fedora)
            curl -fsSLo /etc/yum.repos.d/dzo.repo "$BASE/rpm/dzo.repo"
            # -y confirms the import of the key the repository file names; gpgcheck and
            # repo_gpgcheck then verify the metadata and the package against it
            dnf install -y dzo
            ;;
          arch)
            pacman -Syu --noconfirm --needed ca-certificates
            pacman-key --init
            curl -fsSLo /etc/pacman.d/dzo.conf "$BASE/arch/dzo.conf"
            printf '\nInclude = /etc/pacman.d/dzo.conf\n' >>/etc/pacman.conf
            curl -fsSLo /tmp/dzo-repo-keyring.asc "$BASE/arch/dzo-repo-keyring.asc"
            pacman-key --add /tmp/dzo-repo-keyring.asc
            pacman-key --lsign-key 184CDDC496A9C739D10F67B0FE4EE03444314050
            pacman -Sy --noconfirm dzo
            ;;
          esac
      - name: It is the version this run published
        run: |
          set -eu
          v=$(dzo version)
          echo "$v"
          # Pages' CDN can serve the previous index for a few minutes: a mismatch is reported, the
          # install itself (signatures, dependencies) is what must not fail.
          case "$v" in
          *"$(printf '%s' "$SHA" | cut -c1-7)"*) ;;
          *) echo "::warning title=Older package::the repository still served an older build than $SHA" ;;
          esac
