#
# Build the Sphinx documentation (warnings are errors) and the signed apt
# repository, and publish both on GitHub Pages from main (the docs at /, the
# repository at /apt/). Pull requests only build the docs. Needs Settings >
# Pages > Source: "GitHub Actions" once, and the secret APT_GPG_PRIVATE_KEY
# (see docs/installation.rst). Third-party actions are pinned by commit SHA.

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Sphinx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-sphinx
      - name: Build
        run: make docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: docs-html
          path: docs/_build/html

  apt:
    name: Build apt repository
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Same container as the deb job in ci.yml: the package is built for trixie.
    container:
      image: debian:trixie
    steps:
      - name: Install git (actions/checkout needs it)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: apt-get install -y --no-install-recommends build-essential debhelper python3-sphinx dh-sequence-sphinxdoc reprepro gnupg
      - name: Snapshot version
        # <upcoming release>~git<commits>.<sha>: older than the release, newer than earlier snapshots
        run: scripts/debian-snapshot.sh
      - name: dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b
      - name: Build and sign the repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "secret APT_GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          mkdir debs
          mv ../dzo_*.deb debs/
          scripts/build-apt-repo.sh debs apt-repo
          # the key the repository is signed with must be the published one
          gpg --armor --export | diff - apt/dzo-archive-keyring.asc
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt-repo
          path: apt-repo

  publish:
    name: Assemble the site
    if: github.ref == 'refs/heads/main'
    needs: [build, apt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-html
          path: site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt-repo
          path: site/apt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
