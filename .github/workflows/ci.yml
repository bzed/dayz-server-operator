#
# CI (§C15 of IMPLEMENTATION_PLAN.md): lint -> reuse -> test (+coverage
# gate, Codecov upload) -> licenses -> build -> deb, mirroring the
# .gitlab-ci.yml stages 1:1 over the same `make` targets. All third-party
# actions are pinned by commit SHA (with the released tag as a comment) for
# supply-chain safety; re-verify with
# `git ls-remote --tags https://github.com/<owner>/<repo>` before bumping.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned (rather than "latest") so a new golangci-lint release
          # enabling a stricter default check can't break CI unreviewed;
          # bump deliberately, verifying locally first.
          version: v2.14.0

  reuse:
    name: REUSE / SPDX compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Loopback btrfs for the snapshot tests
        # The btrfs and backup tests run as the unprivileged user on a btrfs
        # filesystem and skip without one. The filesystem is mounted once with
        # root here, and the tests run unprivileged, like dzo does.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs
          truncate -s 2G "$RUNNER_TEMP/btrfs.img"
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          sudo mkdir /mnt/btrfs
          sudo mount -o loop "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo chown "$USER" /mnt/btrfs
          echo "DZO_BTRFS_TESTDIR=/mnt/btrfs" >> "$GITHUB_ENV"
      - name: Run tests (race detector, coverage profile, JUnit report)
        run: make test-race
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          file: ./test-report.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Enforce coverage gate (D20, >= 85%)
        run: make coverage-check

  licenses:
    name: Dependency licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make licenses

  build:
    name: Build binaries
    needs: [lint, reuse, test, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `git describe` in the Makefile needs tag history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build-static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dzo-binaries
          path: dist/*
          if-no-files-found: error

  deb:
    name: Build Debian package
    needs: [lint, reuse, test, licenses]
    runs-on: ubuntu-latest
    # Built inside a real debian:trixie container, not the Ubuntu host
    # actions run on by default: dpkg-buildpackage/lintian/debhelper
    # behaviour is Debian's own, and this is the base every dzo container
    # image uses (§C15/D21), so packaging should be verified against the
    # same distro release, not Ubuntu's divergent versions of the same tools.
    container:
      image: debian:trixie
    steps:
      - name: Install git (actions/checkout needs it; the base image has neither)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `git describe` in the Makefile needs tag history
          submodules: recursive # make servermods packs servermods/*
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          apt-get update
          # build-essential (make, etc.) isn't pulled in by debhelper/lintian
          # themselves and isn't preinstalled in the base image, unlike a
          # real Debian buildd/sbuild chroot; dpkg-checkbuilddeps still wants
          # it present even though Debian policy lets Build-Depends omit it.
          # Running as root here (the container's default user) is why
          # there's no `sudo` in either apt-get invocation in this job.
          apt-get install -y --no-install-recommends build-essential debhelper lintian python3-sphinx dh-sequence-sphinxdoc
      - name: dpkg-buildpackage
        run: dpkg-buildpackage -us -uc -b
      - name: lintian
        # Only errors fail the build; known warnings (e.g. no-manual-page -
        # man pages generated from the CLI are a later phase) stay visible
        # in the log without blocking CI.
        run: lintian --fail-on error ../dzo_*.deb ../dayz-server-operator_*.changes
      - name: Move package artifacts next to the checkout
        run: |
          mkdir -p deb-artifacts
          mv ../dzo_*.deb ../dayz-server-operator_*.buildinfo ../dayz-server-operator_*.changes deb-artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dzo-deb
          path: deb-artifacts/*
          if-no-files-found: error

  package-install:
    name: Install the package in a clean trixie container
    needs: [deb]
    runs-on: ubuntu-latest
    # The package as a user gets it: installed into a bare debian:trixie, with
    # its dependencies from Debian, and run as the service user the package
    # creates (M5).
    container:
      image: debian:trixie
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzo-deb
          path: deb/
      - name: Install the package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./deb/dzo_*.deb
      - name: dzo version
        run: dzo version
      - name: dzo setup --dry-run as the service user
        run: su dayz -s /bin/sh -c 'dzo setup --dry-run'

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, deb, package-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzo-binaries
          path: release/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dzo-deb
          path: release/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            release/dzo-linux-amd64 \
            release/dzo-linux-arm64 \
            release/dzo_*.deb
