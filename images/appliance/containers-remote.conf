#
# Every podman call in the appliance is a client call to the host's rootless
# podman, whose socket the host mounts at /run/host-podman.sock (the quadlet:
# Volume=%t/podman/podman.sock:/run/host-podman.sock). With remote set,
# `podman build`, `podman inspect`, `podman ps` and `dzo instance supervise`
# reach the host without dzo passing --remote anywhere; CONTAINER_HOST
# (environment.d-podman.conf) says which socket.
[engine]
remote = true
