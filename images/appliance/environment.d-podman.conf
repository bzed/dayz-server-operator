#
# The user socket of the host's rootless podman, mounted into the appliance.
# systemd's user manager reads environment.d through its environment generator
# when it starts, so every unit it runs - the supervisors of the game servers,
# dzo's own services - and every login session get the value without dzo
# passing --url. The image's ENV carries the same value for `podman exec`.
CONTAINER_HOST=unix:///run/host-podman.sock
